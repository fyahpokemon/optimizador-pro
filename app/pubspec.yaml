name: optimizador_pro
description: Optimizador Pro — rendimiento estable para Windows y Android.
version: 0.1.0+1
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.0
  win32_registry: ^1.1.5
  # Núcleo en Rust (bindings generados en lib/bridge con flutter_rust_bridge_codegen)
  flutter_rust_bridge: 2.11.1
  # La biblioteca nativa (liboptimizador_core.so) la compila el flujo de la APK con
  # cargo-ndk y la deja en android/app/src/main/jniLibs (ver .github/workflows/android-apk.yml).
  optimizador_android_agent:
    path: ../agents/android-module

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/game_catalog.json
    - assets/process_rules.json
